name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      
      - name: Run go build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -shuffle=on ./...
      
      - name: Run gofmt
        run: |
          files=$(gofmt -l .)
          echo "$files"
          test -z "$files"
