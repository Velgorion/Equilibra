services:

  api:
    build: { context: ., target: api }

    environment:
      DB_DSN: "postgres://user:pa55word@db:5432/equilibra?sslmode=disable"
      ENV: "development"
      VERSION: "v1"

    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  relay:
    build: { context: ., target: relay }

    environment:
      DB_DSN: "postgres://user:pa55word@db:5432/equilibra?sslmode=disable"
      ENV: "development"
      VERSION: "v1"
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "ledger.entries"

    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pa55word
      POSTGRES_DB: equilibra

    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d equilibra" ]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations/:/migrations
    command: [ "-path", "/migrations/", "-database", "postgres://user:pa55word@db:5432/equilibra?sslmode=disable", "up" ]

  kafka:
    image: apache/kafka:4.2.2

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    ports:
      - "9092:9092"

    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.2

    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command: --bootstrap-server kafka:19092 --create --if-not-exists --topic ledger.entries --partitions 3 --replication-factor 1

    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
