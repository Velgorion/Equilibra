receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317


processors:

  memory_limiter:
    check_interval: 1s    
    limit_mib: 256        
    spike_limit_mib: 64

  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: insert

  probabilistic_sampler:
    sampling_percentage: 100

  batch:
    send_batch_size: 1000
    timeout: 5s


exporters:

  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:

  health_check:
    endpoint: 0.0.0.0:13133  # GET http://localhost:13133/ → 200 OK


service:

  telemetry:
    metrics:

      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions: [health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlp_grpc/jaeger]
