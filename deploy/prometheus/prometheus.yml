global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
rule_files:
  - /etc/prometheus/alerts.yml
  
scrape_configs:
  - job_name: 'prometheus'

    scrape_interval: 5s

    static_configs:
      - targets: ['localhost:9090']

  - job_name: "relay"

    static_configs:
      - targets: ['relay:2112']
    
  - job_name: "notification"

    dns_sd_configs:

      - names: ['notification']
        type: A
        port: 2112
    
  - job_name: "kafka"

    static_configs:
      - targets: ['kafka-exporter:9308']